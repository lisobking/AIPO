<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPO Draft Master 2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="accent">ANTI</span>GRAVITY
            </div>
            <div class="status-badge">Professional Draft Service</div>
        </header>

        <main>
            <section class="hero">
                <h1>AutoPO <span class="accent">Draft Master</span></h1>
                <p>비정형 견적서를 세련된 발주서 초안으로 변환합니다.</p>
            </section>

            <section class="upload-area" id="drop-zone">
                <div class="upload-box">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3>견적서를 여기에 끌어다 놓으세요</h3>
                    <p>Excel 또는 PDF 파일을 지원합니다.</p>
                    <input type="file" id="file-input" hidden>
                    <button class="btn-select" onclick="document.getElementById('file-input').click()">또는 파일 선택</button>
                </div>
            </section>

            <section class="loading-state" id="loading-state" style="display: none;">
                <div class="spinner"></div>
                <p>지능형 엔진이 초안을 생성 중입니다...</p>
            </section>

            <section class="result-area" id="result-area" style="display: none;">
                <div class="result-card">
                    <div class="check-icon">✓</div>
                    <h2>변환이 완료되었습니다!</h2>
                    <p id="filename-display"></p>
                    <div class="btn-group">
                        <a id="download-btn" class="btn-download">초안 다운로드</a>
                        <button class="btn-reset" onclick="location.reload()">새 문서 작업</button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Anti-Gravity AutoPO Team. Clean & Smart Automation.</p>
        </footer>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loadingState = document.getElementById('loading-state');
        const resultArea = document.getElementById('result-area');

        // 드래그 앤 드롭 이벤트 구현
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('highlight'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('highlight'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) handleUpload(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleUpload(e.target.files[0]);
        });

        async function handleUpload(file) {
            dropZone.style.display = 'none';
            loadingState.style.display = 'flex';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    loadingState.style.display = 'none';
                    resultArea.style.display = 'block';
                    document.getElementById('filename-display').innerText = result.filename;
                    document.getElementById('download-btn').href = `/download/${result.filename}`;
                }
            } catch (error) {
                alert('처리 중 오류가 발생했습니다. 다시 시도해 주세요.');
                location.reload();
            }
        }
    </script>
</body>
</html>
